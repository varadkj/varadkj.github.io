<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.banner {
  width: 1920px;
  height: 600px;
  position: relative;
  overflow: hidden;
  background: radial-gradient(ellipse at 30% 50%, #0a1a0a 0%, #050d05 40%, #020502 70%, #000000 100%);
}

.grid-bg {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,65,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,65,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: gridPulse 8s ease-in-out infinite;
}

@keyframes gridPulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.8; }
}

.scanlines {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.15) 2px,
    rgba(0,0,0,0.15) 4px
  );
  pointer-events: none;
  z-index: 20;
}

.noise {
  position: absolute;
  inset: 0;
  opacity: 0.035;
  z-index: 21;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 128px 128px;
}

.glow-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.15;
}

.glow-orb.green1 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, #00ff41 0%, transparent 70%);
  top: -100px; left: 10%;
  animation: orbFloat1 12s ease-in-out infinite;
}

.glow-orb.green2 {
  width: 400px; height: 400px;
  background: radial-gradient(circle, #00cc33 0%, transparent 70%);
  bottom: -150px; right: 15%;
  animation: orbFloat2 10s ease-in-out infinite;
}

.glow-orb.cyan {
  width: 300px; height: 300px;
  background: radial-gradient(circle, #00ffaa 0%, transparent 70%);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  opacity: 0.08;
  animation: orbFloat3 15s ease-in-out infinite;
}

@keyframes orbFloat1 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(30px, 20px); }
}
@keyframes orbFloat2 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-20px, -30px); }
}
@keyframes orbFloat3 {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.2); }
}

.code-layer {
  position: absolute;
  inset: 0;
  z-index: 2;
  overflow: hidden;
}

.code-line {
  position: absolute;
  font-family: 'JetBrains Mono', monospace;
  white-space: nowrap;
  color: #00ff41;
  font-size: 13px;
  letter-spacing: 0.5px;
}

.logo-watermark {
  position: absolute;
  z-index: 3;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 480px;
  height: 480px;
  opacity: 0.07;
  filter: grayscale(100%) brightness(2);
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}

.content {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  padding: 0 80px;
}

.left-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.tag-line {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: #00ff41;
  letter-spacing: 4px;
  text-transform: uppercase;
  opacity: 0.9;
  display: flex;
  align-items: center;
  gap: 10px;
}

.tag-line::before {
  content: '>';
  color: #00ff41;
  font-weight: 700;
  text-shadow: 0 0 10px #00ff41;
}

.title-main {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 72px;
  line-height: 0.95;
  letter-spacing: -1px;
  background: linear-gradient(180deg, #ffffff 0%, #b0ffb0 40%, #00ff41 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 30px rgba(0,255,65,0.3));
}

.title-sub {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 300;
  font-size: 32px;
  color: rgba(255,255,255,0.6);
  letter-spacing: 8px;
  text-transform: uppercase;
  margin-top: 4px;
}

.box-name {
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 56px;
  color: #00ff41;
  text-shadow: 0 0 40px rgba(0,255,65,0.5), 0 0 80px rgba(0,255,65,0.2);
  margin-top: 8px;
}

.difficulty-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 6px 18px;
  border: 1px solid rgba(0,255,65,0.3);
  border-radius: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: #00ff41;
  letter-spacing: 3px;
  text-transform: uppercase;
  background: rgba(0,255,65,0.05);
  width: fit-content;
}

.difficulty-badge .dot {
  width: 6px; height: 6px;
  background: #ff8c00;
  border-radius: 50%;
  box-shadow: 0 0 8px #ff8c00;
}

.tags-row {
  display: flex;
  gap: 12px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.tech-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: rgba(0,255,65,0.6);
  border: 1px solid rgba(0,255,65,0.15);
  padding: 3px 10px;
  border-radius: 2px;
  letter-spacing: 1px;
  background: rgba(0,255,65,0.03);
}

.right-section {
  width: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.logo-container {
  width: 280px;
  height: 280px;
  position: relative;
}

.logo-glow {
  position: absolute;
  inset: -40px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,255,65,0.15) 0%, transparent 70%);
  animation: logoGlow 4s ease-in-out infinite;
}

@keyframes logoGlow {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.05); }
}

.logo-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 0 20px rgba(0,255,65,0.3));
}

.corner-deco {
  position: absolute;
  z-index: 15;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: rgba(0,255,65,0.25);
}

.corner-deco.top-left {
  top: 20px; left: 25px;
}
.corner-deco.top-right {
  top: 20px; right: 25px;
  text-align: right;
}
.corner-deco.bottom-left {
  bottom: 20px; left: 25px;
}
.corner-deco.bottom-right {
  bottom: 20px; right: 25px;
  text-align: right;
}

.frame {
  position: absolute;
  inset: 12px;
  border: 1px solid rgba(0,255,65,0.08);
  z-index: 14;
  pointer-events: none;
}

.frame::before {
  content: '';
  position: absolute;
  top: -1px; left: 30px;
  width: 120px; height: 1px;
  background: linear-gradient(90deg, transparent, #00ff41, transparent);
}

.frame::after {
  content: '';
  position: absolute;
  bottom: -1px; right: 30px;
  width: 120px; height: 1px;
  background: linear-gradient(90deg, transparent, #00ff41, transparent);
}

.accent-line {
  position: absolute;
  left: 80px;
  right: 80px;
  bottom: 70px;
  height: 1px;
  background: linear-gradient(90deg, #00ff41, rgba(0,255,65,0.1) 30%, rgba(0,255,65,0.1) 70%, #00ff41);
  z-index: 10;
  opacity: 0.3;
}

.vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
  z-index: 19;
  pointer-events: none;
}
</style>
</head>
